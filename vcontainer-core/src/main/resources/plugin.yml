name: VContainer
version: '1.0'
main: hu.vzone.vcontainer.VContainer
api-version: '1.21'
author: MrVIRO
softdepend:
  - Oraxen
  - MythicMobs
  - ItemsAdder

commands:
  container:
    description: Open your container
    usage: /container
  vcontainer:
    description: Admin container command
    usage: /vcontainer <open|clear|give|give-block|set|reload>

permissions:
  vcontainer.use:
    description: Allows opening the personal container command
    default: op
  vcontainer.admin:
    description: Allows using VContainer admin commands
    default: op
  vcontainer.admin.set:
    description: Allows creating storage blocks with /vcontainer set
    default: op
  vcontainer.block.use:
    description: Allows opening containers from storage blocks
    default: op
  vcontainer.block.remove:
    description: Allows removing storage blocks by sneaking and breaking them
    default: op
  vcontainer.block.limit.bypass:
    description: Bypasses the per-chunk personal storage block limit
    default: op
  vcontainer.notify:
    description: Allows receiving container item notifications
    default: op
