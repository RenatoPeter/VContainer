# VContainer config
# title supports placeholders: %current-page% and %max-page%
title: "&0Container %current-page%/%max-page%"

# Content slots (list of slot indices where items will be shown). If omitted will use default 0-44.
content-slots: []

# Control buttons config
buttons:
  prev:
    material: ARROW
    name: "&a<< Prev"
    lore:
      - "&7Previous Page"
    slot: 45+3
  next:
    material: ARROW
    name: "&aNext >>"
    lore:
      - "&7Next Page"
    slot: 45+5
  sort:
    material: HOPPER
    name: "&bSorting: &f{mode}"
    lore:
      - "&7Click to switch sorting mode"
      - "&7Next: &f{next-mode}"
    slot: 45+4

container-options:
  # If true, players can put items from their own inventory into the container while it is open.
  allow-deposit: true

  # If true, players can take items out of the container.
  allow-withdraw: true

  messages:
    deposit: true
    withdraw: true

  shift-transfer:
    # If true, shift-clicking an item in the player's inventory deposits every configured inventory item.
    deposit-all: true

    # If true, shift-clicking a container item withdraws as many matching items as can fit.
    withdraw-fit: true

    # These are false by default so equipped items stay untouched.
    include-armor: false
    include-offhand: false

  # If true, equal items are shown as one icon with the total amount in lore.
  compact-display:
    enabled: false
    amount-line: "&7Item stack size: &f{amount}"
    withdraw-all-line: "&eLeft click to withdraw all"
    withdraw-one-line: "&eRight click to withdraw 1"

storage-block:
  # How far /vcontainer set can look for a target block.
  set-target-distance: 6

  item:
    material: SCULK_SHRIEKER
    name: "&bPersonal Storage Block"
    lore:
      - "&7Place this block to create"
      - "&7your own linked storage."

  hoppers:
    enabled: true
    input: true
    output: true
    interval-ticks: 8

  hologram:
    enabled: true
    height: 1.35
    see-through: false
    shadow: true
    lines:
      - "&bVContainer"
      - "&7Right click to open"

# If true, equal items are merged together when they are added to the container.
# If false, items added at different times stay as separate entries.
stack: true

# Maximum stack size used when stack is enabled.
max-stack: 64

# Player data folder is player_data by default.
player-data-folder: player_data
